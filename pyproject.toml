[project]
name = "fake-payer"
version = "0.1.0"
description = "A fictional dental insurance phone line for rehearsing automated payer calls (a test fixture, not a product)"
requires-python = ">=3.11"
dependencies = ["websockets>=14", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["fake_payer"]
