# Answers to the questions a practice's insurance verification form asks, one entry per question, in the words the line gives them. `question` is the form's wording; the
# `lookup_benefit_answer` tool finds the entries closest to what the caller asked. Plausible, invented values consistent with the GOLD plan above; nothing here is real.
