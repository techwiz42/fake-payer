# The fictional members, plans and coverage the line answers from. Everything here is made up.
#
# The shape follows how dental plans are commonly described (preventive / basic / major tiers at about 100 / 80 / 50 percent, a small deductible waived for preventive care,
# an annual maximum of one to two thousand dollars, waiting periods that grow with the tier, frequency limits, orthodontics separate with a lifetime maximum), without copying
# any insurer's terms. Descriptions of procedures are plain-language, written for this file; they are not the ADA's official code descriptors (those are copyrighted).
# Names are obviously fictional, dates of birth, member and group numbers are invented. Plan year is the calendar year. "used" counts how many times a member has already had
# a procedure in the current frequency period.
# Adding a member needs no code change: add an entry under `members`, with a `note` saying what it is for.

categories: [preventive, basic, major, orthodontics]        # the order benefits are given in

plans:
  GOLD:
    name: Acme Gold Dental
    annual_maximum: 1500
    deductible: 50
    family_deductible: 150
    deductible_waived_for: [preventive]
    waiting_period_months: {preventive: 0, basic: 3, major: 3, orthodontics: 3}
    percent: {preventive: 100, basic: 80, major: 50, orthodontics: 50}
    orthodontic_lifetime_maximum: 1500
  SILVER:
    name: Acme Silver Dental
    annual_maximum: 1000
    deductible: 75
    family_deductible: 225
    deductible_waived_for: [preventive]
    waiting_period_months: {preventive: 0, basic: 3, major: 3}
    percent: {preventive: 100, basic: 70, major: 40}          # no orthodontic benefit

# What the line answers whoever the patient is, in the words it gives them. These come back with every lookup (even before a patient is found).
standing_answers:
  employee_id: "3141"                         # the representative's employee ID, if asked for it
  fee_schedule: "The fee schedule that applies is dated 2026."
  waiting_period: "The waiting period is three months."
  covered_once_per_lifetime: "Yes."
  missing_tooth_clause: "The plan covers up to two missing teeth."
  paid_by_prior_carrier: "Unknown."
  treatment_in_progress_how_paid: "Unknown."

groups:
  G10001: {plan: GOLD, employer: Sample Manufacturing Company}
  G20002: {plan: SILVER, employer: Example Retail Group}

# Procedure codes the line knows about. `category` picks the plan's percentage; `frequency` is the limit per period (null: none).
procedures:
  D0120: {description: routine exam, category: preventive, frequency: {times: 2, period: calendar year}}
  D0150: {description: first full exam for a new patient, category: preventive, frequency: {times: 1, period: 3 years}}
  D0210: {description: full set of x-rays, category: preventive, frequency: {times: 1, period: 3 years}}
  D0274: {description: four bitewing x-rays, category: preventive, frequency: {times: 1, period: calendar year}}
  D1110: {description: adult cleaning, category: preventive, frequency: {times: 2, period: calendar year}}
  D1206: {description: fluoride varnish, category: preventive, frequency: {times: 1, period: calendar year}}
  D2391: {description: one-surface tooth-coloured filling on a back tooth, category: basic, frequency: null}
  D4341: {description: deep cleaning of four or more teeth in one quarter of the mouth, category: basic, frequency: {times: 1, period: 2 years}}
  D7140: {description: simple tooth removal, category: basic, frequency: null}
  D2740: {description: porcelain crown, category: major, frequency: {times: 1, period: 5 years}}
  D3330: {description: root canal on a back tooth, category: major, frequency: null}
  D8080: {description: comprehensive braces treatment, category: orthodontics, frequency: null}

members:
  M100001:
    first_name: Pat
    last_name: Sample
    date_of_birth: "1985-03-14"
    plan: GOLD
    group_number: G10001
    status: active
    effective_date: "2025-01-01"
    annual_maximum_used: 0
    deductible_met: 0
    used: {}
    note: The ordinary case. Active, nothing used, deductible not yet met.

  M100002:
    first_name: Robin
    last_name: Example
    date_of_birth: "1990-07-02"
    plan: GOLD
    group_number: G10001
    status: active
    effective_date: "2024-01-01"
    annual_maximum_used: 180
    deductible_met: 50
    used: {D1110: 2, D0120: 2}
    note: Frequency limits used up. Cleanings and exams are at their twice-a-year limit; the deductible is met.

  M100003:
    first_name: Casey
    last_name: Placeholder
    date_of_birth: "1978-11-30"
    plan: SILVER
    group_number: G20002
    status: terminated
    effective_date: "2023-01-01"
    termination_date: "2026-06-30"
    annual_maximum_used: 0
    deductible_met: 0
    used: {}
    note: Terminated coverage. The line reports the end date and gives no coverage figures.

  M100004:
    first_name: Jordan
    last_name: Testwell
    date_of_birth: "2001-01-20"
    plan: SILVER
    group_number: G20002
    status: active
    effective_date: "2025-01-01"
    annual_maximum_used: 880
    deductible_met: 75
    used: {D2740: 0}
    note: Annual maximum nearly used. Only the remainder of the maximum is left for a major procedure.
